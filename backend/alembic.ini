[alembic]
# Path to migration scripts
script_location = migration

# Template used to generate migration file names
# Valid tokens include: %(date)s, %(slug)s, %(rev)s, %(year)d, %(month).2d, %(day).2d, %(hour).2d, %(minute).2d, %(second).2d
file_template = %%(rev)s_%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s

# Prepend current directory to sys.path if not present
pythonpath = .

# Placeholder database URL (overridden by settings.database_url inside migration/env.py)
sqlalchemy.url = postgresql+psycopg2://user:password@localhost/dbname

# Logging configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S